name: Import Yakutia moodboard package

on:
  push:
    branches: [main]
    paths:
      - 'Yakutia_M2_GitHub_ready.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract prepared Yakutia page and assets
        run: |
          if [ ! -f Yakutia_M2_GitHub_ready.zip ]; then
            echo "Archive already imported; nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('Yakutia_M2_GitHub_ready.zip')
          target=Path('dist/design-code')
          with zipfile.ZipFile(archive) as z:
              members=z.infolist()
              assert members, 'Archive is empty'
              for member in members:
                  p=Path(member.filename)
                  if p.is_absolute() or '..' in p.parts or not p.as_posix().startswith('dist/design-code/'):
                      raise ValueError('Unexpected file path: '+member.filename)
                  if member.is_dir(): continue
                  destination=Path(member.filename)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(member))
          assert (target/'yakuty.html').exists(), 'Missing Yakuty page'
          print('Imported',len(members),'files')
          PY
          rm Yakutia_M2_GitHub_ready.zip
      - name: Commit imported page and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/design-code/yakuty.html dist/design-code/assets/yakutia Yakutia_M2_GitHub_ready.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish corrected Yakutia storyboard and archive assets"
          git push
