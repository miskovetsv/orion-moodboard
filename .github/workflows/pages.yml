name: Publish moodboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write
concurrency:
  group: moodboard-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Release stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/deployments/7586065047/statuses -f state=inactive -f description='Release stalled Pages publication'
          gh api --method POST repos/${{ github.repository }}/pages/deployments/065fd821c46b47148090e1c5ee6e5414d4fec35b/cancel
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
