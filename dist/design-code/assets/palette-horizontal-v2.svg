<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300"><title>Палитра оформления мероприятия — шесть оттенков в один ряд</title><rect width="1440" height="300" fill="white"/><circle cx="120" cy="112" r="100" fill="#d6b69c"/><text x="120" y="265" fill="#514b44" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Светлый бежевый</text><circle cx="360" cy="112" r="100" fill="#d3a87e"/><text x="360" y="265" fill="#514b44" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Песочный</text><circle cx="600" cy="112" r="100" fill="#794d38"/><text x="600" y="265" fill="#514b44" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Табачный</text><circle cx="840" cy="112" r="100" fill="#733125"/><text x="840" y="265" fill="#514b44" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Терракотовый</text><circle cx="1080" cy="112" r="100" fill="#693428"/><text x="1080" y="265" fill="#514b44" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Винно-коричневый</text><circle cx="1320" cy="112" r="100" fill="#4f3425"/><text x="1320" y="265" fill="#514b44" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Тёмно-коричневый</text></svg>